<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>English Trainer</title>
<style>
:root{--bg:#0b1220;--card:#151f32;--card2:#1d2a40;--text:#f4f7fb;--muted:#a8b4c8;--accent:#70e1b4;--bad:#ff7777;--line:#2c3a52;--gold:#ffd36e}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#101a2d,#090f1b 65%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
main{width:min(100%,580px);margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
header{text-align:center;margin:10px 0 18px}.logo{font-size:40px;margin-bottom:6px}h1{font-size:27px;margin:0 0 6px}.subtitle{color:var(--muted);font-size:14px}
.card{background:rgba(21,31,50,.97);border:1px solid var(--line);border-radius:19px;padding:18px;margin:13px 0;box-shadow:0 12px 30px rgba(0,0,0,.15)}
.menu-card{margin-top:90px}
button,input,select{font:inherit}button{border:0;border-radius:13px;padding:13px 14px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);color:#092116}.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.danger{background:#47232c;color:#ffdfe2;border:1px solid #6a343f}.gold{background:#45391c;color:#ffe7a6;border:1px solid #6e5a2a}
.menu-buttons{display:grid;gap:10px;margin-top:18px}.menu-buttons button{width:100%;font-size:16px;min-height:51px}
.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}
.back{background:transparent;color:var(--muted);padding:8px 0;margin-bottom:5px}
h2{font-size:21px;margin:4px 0 13px}label{display:block;color:var(--muted);font-size:14px;margin:12px 0 6px}
input,select{width:100%;padding:13px;border-radius:11px;background:#0e1727;border:1px solid var(--line);color:var(--text);font-size:16px}
.small{color:var(--muted);font-size:13px;line-height:1.5}.stat{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;gap:10px}.stat strong{color:var(--text)}
.word{font-size:29px;font-weight:800;text-align:center;margin:18px 0 8px;overflow-wrap:anywhere}.hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:15px}
.answers{display:grid;gap:9px}.answer{background:var(--card2);color:var(--text);border:1px solid var(--line);text-align:left;min-height:50px}.answer.correct{background:#123b2d;border-color:#36b883;color:#baffdc}.answer.wrong{background:#49232a;border-color:#e66d7b;color:#ffd9dd}
.feedback{padding:12px;border-radius:11px;margin-top:12px;line-height:1.45}.feedback.ok{background:#123b2d;color:#baffdc}.feedback.no{background:#49232a;color:#ffd9dd}
.progress{height:7px;background:#27344a;border-radius:9px;overflow:hidden;margin:13px 0}.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}
.list{display:grid;gap:8px;margin-top:13px}.word-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:#0e1727;border:1px solid var(--line);border-radius:12px}.word-row strong{display:block;overflow-wrap:anywhere}.word-row span{display:block;color:var(--muted);font-size:13px;margin-top:3px;overflow-wrap:anywhere}.word-actions{display:flex;gap:6px;flex-shrink:0}.icon-btn{padding:8px 10px;background:var(--card2);color:var(--text);border-radius:9px}.empty{text-align:center;color:var(--muted);padding:22px 8px}.hidden{display:none!important}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{font-size:12px;background:#202e45;color:#cbd6e8;border:1px solid var(--line);border-radius:999px;padding:5px 9px}
.flashcard{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px dashed #50617b;border-radius:16px;padding:22px;margin:15px 0;background:#0e1727}.flashcard .word{margin:8px 0}.big-number{font-size:31px;font-weight:800;margin:8px 0}
footer{text-align:center;color:#75839a;font-size:12px;margin:20px 0 5px}
</style>
</head>
<body>
<main>
<header><div class="logo">📘</div><h1>English Trainer</h1><div class="subtitle">Твой личный словарь английского</div></header>
<section id="app"></section>
<footer>Слова хранятся на этом устройстве · Регулярно сохраняй резервную копию</footer>
</main>
<script>
(function(){
"use strict";
const KEY="englishTrainerPersonalWords_v4", STATS="englishTrainerStats_v4";
const initial=[
{en:"hello",ru:"привет",cat:"Повседневные",fav:false},{en:"goodbye",ru:"до свидания",cat:"Повседневные",fav:false},
{en:"please",ru:"пожалуйста",cat:"Повседневные",fav:false},{en:"thank you",ru:"спасибо",cat:"Повседневные",fav:false},
{en:"yes",ru:"да",cat:"Повседневные",fav:false},{en:"no",ru:"нет",cat:"Повседневные",fav:false},
{en:"water",ru:"вода",cat:"Повседневные",fav:false},{en:"food",ru:"еда",cat:"Повседневные",fav:false},
{en:"work",ru:"работа",cat:"Работа",fav:false},{en:"worker",ru:"работник",cat:"Работа",fav:false},
{en:"money",ru:"деньги",cat:"Повседневные",fav:false},{en:"time",ru:"время",cat:"Повседневные",fav:false},
{en:"day",ru:"день",cat:"Время и числа",fav:false},{en:"night",ru:"ночь",cat:"Время и числа",fav:false},
{en:"today",ru:"сегодня",cat:"Время и числа",fav:false},{en:"tomorrow",ru:"завтра",cat:"Время и числа",fav:false},
{en:"help",ru:"помощь; помогать",cat:"Работа",fav:false},{en:"learn",ru:"учить; изучать",cat:"Учёба",fav:false},
{en:"speak",ru:"говорить",cat:"Повседневные",fav:false},{en:"understand",ru:"понимать",cat:"Повседневные",fav:false}
];
const $=id=>document.getElementById(id), app=$("app");
let words=loadWords(), stats=loadStats(), quiz=[], qi=0, score=0, locked=false, mode="enru", flash=[], fi=0, revealed=false, editId=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function loadWords(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");if(Array.isArray(x))return x.map(w=>({...w,id:w.id||uid(),cat:w.cat||"Без категории",fav:!!w.fav,errors:Number(w.errors)||0,seen:Number(w.seen)||0})).filter(w=>w.en&&w.ru)}catch(e){}return initial.map(w=>({...w,id:uid(),errors:0,seen:0}))}
function loadStats(){try{return JSON.parse(localStorage.getItem(STATS)||'{"tests":0,"answered":0,"correct":0,"studyDays":[],"today":""}')}catch(e){return {tests:0,answered:0,correct:0,studyDays:[],today:""}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words));localStorage.setItem(STATS,JSON.stringify(stats))}catch(e){alert("Не удалось сохранить. Экспортируй резервную копию и проверь память браузера.")}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(word){if(!("speechSynthesis" in window)){alert("Озвучивание не поддерживается этим браузером.");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}
function trackDay(){let d=new Date().toISOString().slice(0,10);if(stats.today!==d){stats.today=d;stats.studyDays=stats.studyDays||[];if(!stats.studyDays.includes(d))stats.studyDays.push(d)}}
function back(){return '<button class="back" id="back">← Главное меню</button>'}
function menu(){
 app.innerHTML=`<div class="card menu-card"><div class="stat"><span>Слов в словаре</span><strong>${words.length}</strong></div><div class="stat" style="margin-top:8px"><span>Правильных ответов всего</span><strong>${stats.correct||0}</strong></div>
 <div class="menu-buttons">
 <button class="primary" id="test">▶ Пройти тест</button>
 <button class="secondary" id="flash">🃏 Карточки для запоминания</button>
 <button class="secondary" id="add">＋ Добавить слово</button>
 <button class="secondary" id="dict">📚 Мой словарь · редактировать</button>
 <button class="secondary" id="mistakes">🔄 Повторить ошибки (${words.filter(w=>w.errors>0).length})</button>
 <button class="secondary" id="stats">📊 Моя статистика</button>
 <button class="secondary" id="backup">💾 Резервная копия слов</button>
 </div></div><p class="small" style="text-align:center">Новые слова автоматически попадают в тесты. Сохраняй резервную копию перед сменой браузера или устройства.</p>`;
 $("test").onclick=()=>testSetup(false);$("flash").onclick=startFlash;$("add").onclick=()=>editScreen();$("dict").onclick=dictScreen;$("mistakes").onclick=()=>testSetup(true);$("stats").onclick=statsScreen;$("backup").onclick=backupScreen;
}
function editScreen(id=null){
 editId=id;let w=id?words.find(x=>x.id===id):null;
 app.innerHTML=`${back()}<div class="card"><h2>${w?"Редактировать слово":"Добавить новое слово"}</h2><p class="small">Изменения сохраняются на этом устройстве и будут использоваться в тестах.</p>
 <label for="en">Английское слово или фраза</label><input id="en" autocapitalize="none" value="${esc(w?.en||"")}" placeholder="например, machine">
 <label for="ru">Перевод на русский</label><input id="ru" value="${esc(w?.ru||"")}" placeholder="например, машина">
 <label for="cat">Категория</label><input id="cat" value="${esc(w?.cat||"Повседневные")}" placeholder="например, Работа">
 <div class="row" style="margin-top:16px"><button class="primary" id="saveword">Сохранить</button><button class="secondary" id="cancel">Отмена</button></div><div id="notice" class="small" style="margin-top:10px"></div></div>`;
 $("back").onclick=menu;$("cancel").onclick=()=>id?dictScreen():menu();
 $("saveword").onclick=()=>{
  let en=$("en").value.trim(),ru=$("ru").value.trim(),cat=$("cat").value.trim()||"Без категории";
  if(!en||!ru){$("notice").textContent="Заполни английское слово и перевод.";return}
  let duplicate=words.find(x=>x.en.toLowerCase()===en.toLowerCase()&&x.id!==id);
  if(duplicate){$("notice").textContent="Такое английское слово уже есть. Открой его в словаре и отредактируй.";return}
  if(id){let old=words.find(x=>x.id===id);if(old)Object.assign(old,{en,ru,cat})}
  else words.push({id:uid(),en,ru,cat,fav:false,errors:0,seen:0});
  save();dictScreen();
 };
}
function dictScreen(){
 app.innerHTML=`${back()}<div class="card"><h2>Мой словарь (${words.length})</h2><input id="search" placeholder="🔍 Поиск слова или перевода"><label for="categoryFilter">Фильтр по категории</label><select id="categoryFilter"><option value="">Все категории</option>${[...new Set(words.map(w=>w.cat||"Без категории"))].sort().map(c=>`<option>${esc(c)}</option>`).join("")}</select>
 <div class="row" style="margin-top:10px"><button class="primary" id="new">＋ Добавить</button><button class="secondary" id="export">Экспорт слов</button></div><div id="wordlist" class="list"></div></div>`;
 $("back").onclick=menu;$("new").onclick=()=>editScreen();$("export").onclick=downloadBackup;
 function render(){
  const q=$("search").value.trim().toLowerCase(),cat=$("categoryFilter").value,list=$("wordlist");
  let filtered=words.filter(w=>(!cat||w.cat===cat)&&(!q||(w.en+" "+w.ru+" "+w.cat).toLowerCase().includes(q)));
  list.innerHTML="";
  if(!filtered.length){list.innerHTML='<div class="empty">Слова не найдены.</div>';return}
  filtered.forEach(w=>{
   let el=document.createElement("div");el.className="word-row";
   el.innerHTML=`<div style="min-width:0"><strong>${esc(w.en)} ${w.fav?"⭐":""}</strong><span>${esc(w.ru)} · ${esc(w.cat)}</span>${w.errors?`<span>Ошибок: ${w.errors}</span>`:""}</div><div class="word-actions"><button class="icon-btn" title="Озвучить">🔊</button><button class="icon-btn" title="Избранное">${w.fav?"⭐":"☆"}</button><button class="icon-btn" title="Редактировать">✏️</button><button class="icon-btn" title="Удалить">🗑️</button></div>`;
   let b=el.querySelectorAll("button");b[0].onclick=()=>speak(w.en);b[1].onclick=()=>{w.fav=!w.fav;save();render()};b[2].onclick=()=>editScreen(w.id);b[3].onclick=()=>{if(confirm(`Удалить слово «${w.en}»?`)){words=words.filter(x=>x.id!==w.id);save();render()}};
   list.appendChild(el);
  });
 }
 $("search").oninput=render;$("categoryFilter").onchange=render;render();
}
function testSetup(errorsOnly){
 let pool=words.filter(w=>!errorsOnly||w.errors>0);
 if(pool.length<2){app.innerHTML=`${back()}<div class="card"><h2>Пока недостаточно слов</h2><p class="small">${errorsOnly?"В списке ошибок пока меньше двух слов.":"Для теста нужно хотя бы два слова."} Добавь слова или пройди обычный тест.</p><button class="primary" id="add" style="width:100%">Добавить слово</button></div>`;$("back").onclick=menu;$("add").onclick=()=>editScreen();return}
 app.innerHTML=`${back()}<div class="card"><h2>${errorsOnly?"Повторить ошибки":"Настройка теста"}</h2><p class="small">Выбери режим. В тест попадут твои слова из словаря.</p><label for="mode">Режим тестирования</label><select id="mode"><option value="enru">Английское → выбрать русский перевод</option><option value="ruen">Русский → выбрать английское слово</option><option value="typing">Написать английское слово</option></select><label for="pool">Какие слова учить</label><select id="pool"><option value="all">Все слова (${words.length})</option><option value="fav">Избранные (${words.filter(w=>w.fav).length})</option><option value="errors">Слова с ошибками (${words.filter(w=>w.errors>0).length})</option></select><button class="primary" id="begin" style="width:100%;margin-top:16px">Начать тест</button></div>`;
 $("back").onclick=menu;
 $("begin").onclick=()=>{
  mode=$("mode").value;let selected=$("pool").value;
  pool=words.filter(w=>selected==="fav"?w.fav:selected==="errors"?w.errors>0:true);
  if(pool.length<2){alert("В выбранной группе должно быть хотя бы два слова.");return}
  quiz=shuffle(pool);qi=0;score=0;stats.tests=(stats.tests||0)+1;trackDay();save();showQ();
 };
}
function showQ(){
 locked=false;if(qi>=quiz.length){result();return}
 let w=quiz[qi];w.seen=(w.seen||0)+1;save();
 let question=mode==="ruen"?w.ru:w.en;
 let choices=shuffle([w,...shuffle(words.filter(x=>x.id!==w.id)).slice(0,3)]);
 app.innerHTML=`${back()}<div class="card"><div class="stat"><span>Вопрос ${qi+1} из ${quiz.length}</span><span>Верно: ${score}</span></div><div class="progress"><span style="width:${qi/quiz.length*100}%"></span></div><div class="hint">${mode==="ruen"?"Выбери английское слово":mode==="typing"?"Напиши английское слово":"Выбери правильный перевод"}</div><div class="word">${esc(question)} ${mode==="enru"?'<button class="icon-btn" id="say" title="Озвучить">🔊</button>':""}</div>
 ${mode==="typing"?`<input id="typed" autocapitalize="none" placeholder="Введи английское слово" autocomplete="off"><button class="primary" id="checktyped" style="width:100%;margin-top:12px">Проверить</button>`:`<div class="answers">${choices.map((x,i)=>`<button class="answer" data-i="${i}">${esc(mode==="ruen"?x.en:x.ru)}</button>`).join("")}</div>`}
 <div id="feedback"></div><button id="next" class="primary hidden" style="width:100%;margin-top:13px">${qi===quiz.length-1?"Посмотреть результат":"Следующий вопрос →"}</button></div>`;
 $("back").onclick=()=>{if(confirm("Выйти из теста?"))menu()};if($("say"))$("say").onclick=()=>speak(w.en);
 function answer(ok,selectedText,buttons=[]){
  if(locked)return;locked=true;stats.answered=(stats.answered||0)+1;
  if(ok){score++;stats.correct=(stats.correct||0)+1}else w.errors=(w.errors||0)+1;
  if(ok)w.errors=Math.max(0,(w.errors||0)-1);
  buttons.forEach((b,i)=>{b.disabled=true;if(b.dataset.correct==="yes")b.classList.add("correct");else if(b.dataset.selected==="yes")b.classList.add("wrong")});
  $("feedback").innerHTML=`<div class="feedback ${ok?"ok":"no"}">${ok?"✅ Правильно!":"❌ Ошибка."}<br>Правильный ответ: <strong>${esc(mode==="ruen"?w.en:w.ru)}</strong>${!ok&&selectedText?`<br>Твой ответ: ${esc(selectedText)}`:""}</div>`;
  $("next").classList.remove("hidden");save();
 }
 if(mode==="typing"){
  $("checktyped").onclick=()=>{let val=$("typed").value.trim();let ok=val.toLowerCase()===w.en.toLowerCase();answer(ok,val);$("checktyped").disabled=true;$("typed").disabled=true};
  $("typed").addEventListener("keydown",e=>{if(e.key==="Enter")$("checktyped").click()});
 }else{
  let buttons=[...app.querySelectorAll(".answer")];buttons.forEach((b,i)=>{
   let right=choices[i].id===w.id;b.dataset.correct=right?"yes":"no";
   b.onclick=()=>{let ok=right;b.dataset.selected="yes";answer(ok,mode==="ruen"?choices[i].en:choices[i].ru,buttons)};
  });
 }
 $("next").onclick=()=>{qi++;showQ()};
}
function result(){
 let pct=Math.round(score/quiz.length*100);
 app.innerHTML=`<div class="card" style="text-align:center"><div class="logo">${pct>=80?"🏆":"💪"}</div><h2>Тест завершён!</h2><div class="big-number">${score} / ${quiz.length}</div><p>${pct}% правильных ответов</p><p class="small">${pct===100?"Прекрасно! Все ответы правильные.":pct>=70?"Хороший результат. Продолжай повторять слова.":"Повтори ошибки и попробуй ещё раз."}</p><button class="primary" id="again" style="width:100%">Пройти ещё раз</button><button class="secondary" id="home" style="width:100%;margin-top:9px">Главное меню</button></div>`;
 $("again").onclick=()=>testSetup(false);$("home").onclick=menu;
}
function startFlash(){
 if(!words.length){editScreen();return}
 flash=shuffle([...words]);fi=0;revealed=false;showFlash();
}
function showFlash(){
 if(fi>=flash.length)fi=0;let w=flash[fi];revealed=false;
 app.innerHTML=`${back()}<div class="card"><div class="stat"><span>Карточка ${fi+1} из ${flash.length}</span><span>${esc(w.cat)}</span></div><div class="flashcard"><div class="hint">Вспомни перевод</div><div class="word">${esc(w.en)}</div><button class="icon-btn" id="say">🔊 Произношение</button><div id="translation" class="word hidden" style="font-size:23px">${esc(w.ru)}</div></div><button class="primary" id="reveal" style="width:100%">Показать перевод</button><div class="row" style="margin-top:10px"><button class="secondary" id="hard">Сложно</button><button class="secondary" id="easy">Знаю</button></div><button class="secondary" id="next" style="width:100%;margin-top:10px">Следующая карточка →</button></div>`;
 $("back").onclick=menu;$("say").onclick=()=>speak(w.en);$("reveal").onclick=()=>{$("translation").classList.remove("hidden");$("reveal").classList.add("hidden")};
 $("hard").onclick=()=>{w.errors=(w.errors||0)+1;save();fi++;showFlash()};$("easy").onclick=()=>{w.errors=Math.max(0,(w.errors||0)-1);trackDay();save();fi++;showFlash()};$("next").onclick=()=>{fi++;showFlash()};
}
function statsScreen(){
 let pct=stats.answered?Math.round(stats.correct/stats.answered*100):0;
 app.innerHTML=`${back()}<div class="card"><h2>Моя статистика</h2><div class="stat"><span>Слов в словаре</span><strong>${words.length}</strong></div><div class="stat" style="margin-top:12px"><span>Пройдено тестов</span><strong>${stats.tests||0}</strong></div><div class="stat" style="margin-top:12px"><span>Всего ответов</span><strong>${stats.answered||0}</strong></div><div class="stat" style="margin-top:12px"><span>Правильных ответов</span><strong>${stats.correct||0} (${pct}%)</strong></div><div class="stat" style="margin-top:12px"><span>Слова с ошибками</span><strong>${words.filter(w=>w.errors>0).length}</strong></div><div class="stat" style="margin-top:12px"><span>Дней с занятиями</span><strong>${(stats.studyDays||[]).length}</strong></div><p class="small" style="margin-top:16px">Статистика хранится только в этом браузере на этом устройстве.</p></div>`;
 $("back").onclick=menu;
}
function backupScreen(){
 app.innerHTML=`${back()}<div class="card"><h2>Резервная копия</h2><p class="small">Скачай копию слов и статистики. Если очистишь данные Safari или сменишь устройство, импортируй этот файл, чтобы восстановить словарь.</p><button class="primary" id="export" style="width:100%">⬇️ Скачать резервную копию</button><label for="importfile">Восстановить из файла</label><input id="importfile" type="file" accept=".json,application/json"><p class="small">Импорт заменит текущий словарь и статистику содержимым файла.</p><button class="danger" id="import" style="width:100%">Импортировать копию</button></div>`;
 $("back").onclick=menu;$("export").onclick=downloadBackup;
 $("import").onclick=async()=>{
  const file=$("importfile").files[0];if(!file){alert("Сначала выбери файл резервной копии.");return}
  try{const data=JSON.parse(await file.text());if(!Array.isArray(data.words))throw new Error("bad");
   if(!confirm(`Заменить текущий словарь ${words.length} словами из копии?`))return;
   words=data.words.filter(w=>w&&w.en&&w.ru).map(w=>({...w,id:w.id||uid(),cat:w.cat||"Без категории",fav:!!w.fav,errors:Number(w.errors)||0,seen:Number(w.seen)||0}));
   stats=data.stats||{tests:0,answered:0,correct:0,studyDays:[],today:""};save();alert("Резервная копия восстановлена!");menu();
  }catch(e){alert("Не удалось прочитать файл. Выбери резервную копию English Trainer в формате JSON.")}
 };
}
function downloadBackup(){
 const blob=new Blob([JSON.stringify({app:"English Trainer",version:4,exportedAt:new Date().toISOString(),words,stats},null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="english-trainer-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
menu();
})();
</script>
</body>
