<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Английский — тесты и слова</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:680px;margin:auto;padding:14px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 5px 24px #17203312}.small{color:#667085;font-size:14px;display:flex;justify-content:space-between;gap:8px}.track{height:7px;background:#e7ebf4;border-radius:10px;margin:12px 0 24px;overflow:hidden}.fill{height:100%;background:#2457d6}h1{font-size:25px;margin:0 0 8px}h2{font-size:22px;line-height:1.4;margin:18px 0}.intro{color:#667085;line-height:1.5;margin:0 0 22px}.menu-buttons{display:grid;gap:12px;margin-top:24px}.bigbtn{display:block;position:relative;z-index:2;cursor:pointer;-webkit-appearance:none;appearance:none;width:100%;padding:17px 14px;border:0;border-radius:14px;font-size:17px;font-weight:750;text-align:left;min-height:60px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.primary{background:#2457d6;color:white}.secondary{background:#edf0f6;color:#27334a}.option{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border:2px solid #dfe5ef;border-radius:13px;background:white;color:#182033;font-size:16px;line-height:1.35;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.letter{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:#eff2f8;display:grid;place-items:center;font-weight:700}.options{display:grid;gap:10px}.actions,.bar{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.btn{position:relative;z-index:2;cursor:pointer;-webkit-appearance:none;appearance:none;border:0;border-radius:13px;padding:15px 12px;font-size:16px;font-weight:700;min-height:52px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.back{background:#edf0f6;color:#27334a;width:35%}.next{background:#2457d6;color:white;flex:1}.next:disabled{background:#aab8d9}.hint{font-size:14px;color:#667085;text-align:center;line-height:1.45;margin:14px 0 0;padding:10px;border-radius:10px}.hint.correct{color:#137547;background:#eaf8f0}.hint.incorrect{color:#b42318;background:#fff0f0}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:650}.field input,.field textarea{width:100%;padding:13px;border:1px solid #cfd6e3;border-radius:11px;font:inherit;background:#fff;color:#182033}.field textarea{min-height:85px;resize:vertical}.wordlist{display:grid;gap:10px;margin-top:18px}.word{border:1px solid #e1e6ef;border-radius:12px;padding:12px;line-height:1.45}.word strong{font-size:17px}.word small{display:block;color:#667085;margin-top:4px}.score{font-size:48px;color:#2457d6;font-weight:800;text-align:center;margin:18px}.review-item{padding:13px 0;border-top:1px solid #e7eaf1;line-height:1.5}.good{color:#16804a}.bad{color:#b42318}.notice{font-size:14px;color:#667085;line-height:1.45}.pill{display:inline-block;border-radius:99px;background:#eef3ff;padding:4px 9px;color:#2457d6;font-size:12px;font-weight:700}
</style></head><body><main><section class="card" id="app"></section></main><script>
const BASE_BANK=[["Как сказать «говорить»?", ["Speak", "Read", "Spend", "Take"], 0, "Speak = говорить."], ["Как сказать «учить что-то, узнавать новое»?", ["Teach", "Learn", "Study somewhere", "Ask"], 1, "Learn — учить/изучать что-то самому."], ["Как сказать «учиться в учебном заведении»?", ["Study", "Say", "Use", "Give"], 0, "Study часто используют для занятий и учёбы."], ["Как сказать «много воды»?", ["Many water", "Much water", "Many waters", "Much waters"], 1, "Water — неисчисляемое существительное; обычно используем much."], ["Как сказать «много книг»?", ["Much books", "Many books", "Much book", "A many books"], 1, "Books — исчисляемое существительное во множественном числе."], ["Как сказать «действительно, очень»?", ["Really", "Later", "Without", "Together"], 0, "Really = действительно, очень."], ["Как сказать «часто»?", ["Soon", "Often", "Yesterday", "Different"], 1, "Often = часто."], ["Как сказать «читать»?", ["Read", "Teach", "Take", "Cost"], 0, "Read = читать."], ["Как сказать «делать»?", ["Do", "Say", "Give", "Use"], 0, "Do = делать."], ["Как сказать «мочь, уметь»?", ["Want", "Can", "Need", "Much"], 1, "Can выражает возможность или умение."], ["Как сказать «хотеть»?", ["Want", "Watch", "Ask", "Spend"], 0, "Want = хотеть."], ["Как сказать «вещь»?", ["Thing", "Time", "Work", "Service"], 0, "Thing = вещь, предмет."], ["Как сказать «бегло»?", ["Correctly", "Fluently", "Often", "Really"], 1, "Fluently = бегло, свободно."], ["Как сказать «правильно»?", ["Different", "Correctly", "Together", "Later"], 1, "Correctly = правильно."], ["Как сказать «без»?", ["About", "Without", "Another", "Better"], 1, "Without = без."], ["Как сказать «ошибка»?", ["Mistake", "Thing", "Practice", "Question"], 0, "Mistake = ошибка."], ["Как сказать «Я хотел(а) бы…»?", ["I don't", "I'd like to", "I can to", "I want yesterday"], 1, "I'd like to… — вежливое «я хотел(а) бы…»."], ["Как сказать «мой / моя / моё»?", ["My", "More", "Many", "Much"], 0, "My = мой, моя, моё."], ["Как сказать «позже»?", ["Yesterday", "Later", "Soon", "Now"], 1, "Later = позже."], ["Как сказать «другой, отличающийся»?", ["Different", "Together", "Correctly", "Really"], 0, "Different = другой, отличающийся."], ["Как сказать «думать»?", ["Think", "Teach", "Take", "Tell"], 0, "Think = думать."], ["Как сказать «смотреть телевизор» (глагол «смотреть»)?", ["Watch", "Read", "Speak", "Ask"], 0, "Watch = смотреть."], ["Как сказать «скоро»?", ["Soon", "Yesterday", "Often", "Without"], 0, "Soon = скоро."], ["Как сказать «вместе»?", ["Together", "Another", "Better", "About"], 0, "Together = вместе."], ["Как сказать «стоить»?", ["Cost", "Spend", "Need", "Give"], 0, "Cost = стоить."], ["Как сказать «обучать кого-то»?", ["Learn", "Teach", "Study", "Read"], 1, "Teach = обучать, преподавать."], ["Как сказать «вчера»?", ["Today", "Tomorrow", "Yesterday", "Later"], 2, "Yesterday = вчера."], ["Как сказать «сегодня»?", ["Today", "Tomorrow", "Yesterday", "Soon"], 0, "Today = сегодня."], ["Как сказать «завтра»?", ["Tomorrow", "Today", "Together", "Later"], 0, "Tomorrow = завтра."], ["Как сказать «но»?", ["Because", "But", "About", "Without"], 1, "But = но."], ["Как сказать «лучше»?", ["Better", "Different", "Really", "More"], 0, "Better = лучше."], ["Как сказать «нуждаться / нужно»?", ["Need", "Want", "Cost", "Watch"], 0, "Need = нуждаться, нужно."], ["Как сказать «больше / ещё»?", ["More", "Many", "Much", "My"], 0, "More = больше, ещё."], ["Как сказать «сейчас»?", ["Soon", "Now", "Later", "Yesterday"], 1, "Now = сейчас."], ["Как сказать «обслуживание / сервис»?", ["Service", "Mistake", "Thing", "Practice"], 0, "Service = сервис, обслуживание."], ["Как сказать «тратить»?", ["Spend", "Cost", "Give", "Take"], 0, "Spend = тратить."], ["Как сказать «о / об»?", ["About", "Without", "Together", "Different"], 0, "Talk about work = говорить о работе."], ["Как сказать «говорить о чём-то»?", ["Talk about something", "Speak yesterday", "Say to work about", "Tell about to"], 0, "Talk about something = говорить о чём-то."], ["Как сказать «давай…»?", ["Let's", "Lets to", "We let's", "Let"], 0, "Let's + глагол = давай сделаем что-то."], ["Как сказать «ещё один / другая штука»?", ["Another", "Other one of", "Different one", "More another"], 0, "Another = ещё один / другой."], ["Как сказать «я не…»?", ["I don't", "He doesn't", "I doesn't", "I not"], 0, "I don't используется с I в отрицаниях Present Simple."], ["Как сказать «он не…»?", ["He don't", "He doesn't", "He not", "He isn't want"], 1, "He doesn't + начальная форма глагола."], ["Как сказать «сказать»?", ["Say", "Ask", "Use", "Take"], 0, "Say = сказать."], ["Как сказать «взять»?", ["Give", "Take", "Tell", "Spend"], 1, "Take = взять."], ["Как сказать «использовать»?", ["Use", "Ask", "Say", "Cost"], 0, "Use = использовать."], ["Как сказать «спросить»?", ["Give", "Ask", "Take", "Speak"], 1, "Ask = спросить."], ["Как сказать «дать»?", ["Say", "Give", "Use", "Read"], 1, "Give = дать."], ["Как сказать «Я не понимаю»?", ["I don't understand", "I doesn't understand", "I not understanding", "I don't understands"], 0, "I don't understand = Я не понимаю."], ["Как сказать «Я хочу выучить английский»?", ["I want to learn English", "I want learn to English", "I want to teach English", "I want learning English"], 0, "Want to + глагол; learn English = изучать английский."], ["Как сказать «Она часто смотрит телевизор»?", ["She often watches TV", "She often watch TV", "She watches often TV yesterday", "She is often watch TV"], 0, "С she в Present Simple: watches."], ["Как сказать «Я хотел бы ещё одну чашку чая»?", ["I'd like another cup of tea", "I'd like different cup tea", "I'd like other a cup of tea", "I like to another tea"], 0, "Another cup = ещё одна чашка."], ["Как сказать «Сколько времени ты тратишь на английский?»", ["How many time do you spend on English?", "How much time do you spend on English?", "How much time you spend English?", "How many times you spend English?"], 1, "Time в значении длительности — неисчисляемое; how much time."], ["Как сказать «Мне нужно больше практики»?", ["I need more practice", "I need many practice", "I needs more practice", "I need practice more time"], 0, "Need more practice = нужно больше практики."], ["Как сказать «Давай поговорим о чём-то другом»?", ["Let's talk about something different", "Let's speak something another", "Let's talk something different", "Let's talking about different"], 0, "Talk about something = говорить о чём-то."], ["Как сказать «Я часто использую этот компьютер»?", ["I often use this computer", "I often uses this computer", "I often using this computer", "I often give this computer"], 0, "С I глагол use не получает -s."], ["Как сказать «Можешь дать мне больше времени?»", ["Can you give me more time?", "Can you say me more time?", "Can you take me more time?", "Can you ask me more time?"], 0, "Give me = дать мне."], ["Как сказать «Что она сказала?»", ["What did she say?", "What she did said?", "What did she says?", "What does she said?"], 0, "После did используем начальную форму say."], ["Как сказать «Я потратил деньги вчера»?", ["I spend money yesterday", "I spent money yesterday", "I spending money yesterday", "I spends money yesterday"], 1, "Прошедшая форма spend — spent."], ["Как сказать «Я могу говорить по-английски»?", ["I can speak English", "I can to speak English", "I can speaks English", "I can speaking English"], 0, "После can используется глагол без to."], ["Как сказать «Он не хочет учиться здесь»?", ["He doesn't want to study here", "He don't want study here", "He doesn't wants to study here", "He not wants study here"], 0, "He doesn't + want без -s."], ["Как сказать «Я хочу сказать тебе кое-что»?", ["I want to say something to you", "I want ask something you", "I want to take something you", "I want say you something yesterday"], 0, "Say something to you = сказать тебе кое-что."], ["Как сказать «Пожалуйста, спроси учителя»?", ["Please ask the teacher", "Please say the teacher", "Please use the teacher", "Please take the teacher"], 0, "Ask the teacher = спроси учителя."], ["Как сказать «Он дал мне книгу»?", ["He took me a book", "He gave me a book", "He asked me a book", "He said me a book"], 1, "Прошедшая форма give — gave."], ["Как сказать «Возьми свою сумку»?", ["Take your bag", "Give your bag", "Ask your bag", "Say your bag"], 0, "Take your bag = возьми свою сумку."], ["Как сказать «Я изучаю английский без ошибок»?", ["I study English without mistakes", "I study English mistakes without", "I study English many mistake", "I study English without mistake yesterday"], 0, "Without mistakes = без ошибок."], ["Как сказать «Давай учиться вместе»?", ["Let's study together", "Let's together studies", "Let's studying together", "Let's study another"], 0, "Let's study together = давай учиться вместе."], ["Как сказать «Эта работа другая, но лучше»?", ["This job is different, but better", "This job different, but gooder", "This job is another, but good", "This work is many, but better"], 0, "Different = другая; better = лучше."], ["Как сказать «Я хочу научиться говорить свободно»?", ["I want to learn to speak fluently", "I want learn speak fluently", "I want to speaking fluently", "I want speak without fluently"], 0, "Want to learn to speak = хочу научиться говорить."], ["Как сказать «Можешь воспользоваться моим компьютером?»", ["Can you use my computer?", "Can you give my computer?", "Can you say my computer?", "Can you ask my computer?"], 0, "Use my computer = воспользоваться моим компьютером."], ["Как сказать «Как много книг ты читаешь?»", ["How many books do you read?", "How much books do you read?", "How many books you reads?", "How much book do you reads?"], 0, "Books исчисляемое множественное число: how many."], ["Как сказать «Я думаю, это хорошая вещь»?", ["I think this is a good thing", "I think this a good thing is", "I thinks this is good thing", "I am think this is good thing"], 0, "I think = я думаю; a good thing = хорошая вещь."], ["Как сказать «Я хотел бы говорить по-английски»?", ["I'd like to speak English", "I'd like speak English", "I'd like speaking English", "I like to speaking English"], 0, "I'd like to + начальная форма глагола."], ["Как сказать «Я хочу изучать что-то новое каждый день»?", ["I want to learn something new every day", "I want learn anything new every day", "I want to learning something new every day", "I want to learn something yesterday"], 0, "Something new = что-то новое."], ["Как сказать «Мне нужно больше времени, но я могу начать сейчас»?", ["I need more time, but I can start now", "I need many time, but I can start now", "I needs more time but can starts now", "I need more time because I start yesterday"], 0, "Need more time; can start now."], ["Как сказать «Я хотел бы поговорить о работе»?", ["I'd like to talk about work", "I'd like talk work about", "I'd like to speak work about", "I want talking about work"], 0, "Talk about work = говорить о работе."]];
const STORE_WORDS="englishUserWords_v1", STORE_SEEN="englishQuizSeen_v2", letters=["A","B","C","D"], $=id=>document.getElementById(id);
function readWords(){try{return JSON.parse(localStorage.getItem(STORE_WORDS)||"[]")}catch(e){return []}}
function saveWords(w){try{localStorage.setItem(STORE_WORDS,JSON.stringify(w));return true}catch(e){return false}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function userBank(){return readWords().map(w=>({q:`Как сказать «${w.ru}»?`,o:[w.en,"I want to learn English","I can speak English","I need more time"],a:0,e:`${w.en} = ${w.ru}${w.note?" — "+w.note:""}`}))}
function bank(){return [...BASE_BANK.map(x=>({q:x[0],o:x[1],a:x[2],e:x[3]})),...userBank()]}
document.addEventListener("click",function(e){const b=e.target.closest("button");if(!b)return;if(b.id==="start"&&!b.onclick)startTest();if(b.id==="add"&&!b.onclick)addScreen();if(b.id==="list"&&!b.onclick)listScreen();});
function menu(){let words=readWords();$("app").innerHTML=`<div class="small"><span>🇬🇧 Английский</span><span class="pill">${BASE_BANK.length+words.length} вопросов в базе</span></div><h1 style="margin-top:22px">Главное меню</h1><p class="intro">Тренируй изученные слова и добавляй новые. Слова сохраняются в браузере на этом устройстве.</p><div class="menu-buttons"><button class="bigbtn primary" id="start">📝 Пройти тест · 20 вопросов</button><button class="bigbtn secondary" id="add">➕ Добавить слова</button><button class="bigbtn secondary" id="list">📚 Мои добавленные слова (${words.length})</button></div><p class="notice" style="margin-top:18px">Новые слова будут включаться в следующие тесты. Варианты ответов перемешиваются.</p>`;$("start").onclick=startTest;$("add").onclick=addScreen;$("list").onclick=listScreen}
function addScreen(){$("app").innerHTML=`<button class="btn back" id="home">← Главное меню</button><h1 style="margin-top:20px">Добавить слова</h1><p class="intro">Введи английское слово или фразу и русский перевод. Новые слова попадут в будущие тесты.</p><form id="form"><div class="field"><label for="en">Слово/фраза на английском *</label><input id="en" required placeholder="например, improve" autocomplete="off"></div><div class="field"><label for="ru">Перевод на русский *</label><input id="ru" required placeholder="например, улучшать" autocomplete="off"></div><div class="field"><label for="note">Примечание (необязательно)</label><textarea id="note" placeholder="пример или подсказка для объяснения"></textarea></div><button class="btn next" type="submit" style="width:100%">💾 Сохранить слово</button></form><div id="status" class="hint"></div><div class="bar"><button class="btn back" id="again">Добавить ещё</button><button class="btn next" id="test">Пройти тест</button></div>`;$("home").onclick=menu;$("again").onclick=()=>$("en").focus();$("test").onclick=startTest;$("form").onsubmit=e=>{e.preventDefault();let en=$("en").value.trim(),ru=$("ru").value.trim(),note=$("note").value.trim(),w=readWords();if(w.some(x=>x.en.toLowerCase()===en.toLowerCase()&&x.ru.toLowerCase()===ru.toLowerCase())){$("status").className="hint incorrect";$("status").textContent="Такое слово с этим переводом уже добавлено.";return}w.push({en,ru,note});if(saveWords(w)){$("status").className="hint correct";$("status").textContent=`Сохранено: ${en} — ${ru}. Оно появится в будущих тестах.`;$("form").reset()}else{$("status").className="hint incorrect";$("status").textContent="Не удалось сохранить в браузере."}}}
function listScreen(){let w=readWords();$("app").innerHTML=`<button class="btn back" id="home">← Главное меню</button><h1 style="margin-top:20px">Мои добавленные слова</h1><p class="intro">Всего: ${w.length}</p><div class="wordlist" id="words"></div><div class="bar"><button class="btn next" id="add">➕ Добавить слова</button><button class="btn back" id="export">Экспортировать</button></div>`;$("home").onclick=menu;$("add").onclick=addScreen;$("export").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(readWords(),null,2)],{type:"application/json"}));a.href=u;a.download="my-english-words.json";a.click();URL.revokeObjectURL(u)};let box=$("words");if(!w.length){box.innerHTML='<p class="notice">Пока нет слов. Нажми «Добавить слова».</p>';return}w.forEach((x,i)=>{let d=document.createElement("div");d.className="word";d.innerHTML=`<strong>${esc(x.en)}</strong> — ${esc(x.ru)}${x.note?`<small>${esc(x.note)}</small>`:""}<div style="margin-top:8px"><button class="btn back" data-del="${i}">Удалить</button></div>`;box.appendChild(d)});box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{let a=readWords();a.splice(+b.dataset.del,1);saveWords(a);listScreen()})}
let round=[],n=0,answers=[];
function startTest(){let b=bank(),seen=[];try{seen=JSON.parse(localStorage.getItem(STORE_SEEN)||"[]")}catch(e){}let available=b.map((_,i)=>i).filter(i=>!seen.includes(i));if(available.length<20){seen=[];available=b.map((_,i)=>i)}let ids=shuffle(available).slice(0,20);try{localStorage.setItem(STORE_SEEN,JSON.stringify([...seen,...ids]))}catch(e){}round=ids.map(i=>{let q=b[i],opts=q.o.map((label,j)=>({label,correct:j===q.a}));shuffle(opts);return{q:q.q,opts,explain:q.e}});n=0;answers=Array(20).fill(null);renderQ()}
function renderQ(){let q=round[n];$("app").innerHTML=`<div class="small"><span>🇬🇧 Тест</span><span>Вопрос ${n+1} из 20</span></div><div class="track"><div class="fill" style="width:${(n+1)/20*100}%"></div></div><h2>${esc(q.q)}</h2><div class="options" id="options"></div><div class="actions"><button class="btn back" id="back">← Назад</button><button class="btn next" id="next" disabled>Выбери ответ</button></div><p class="hint" id="hint">Выбери один из четырёх вариантов.</p><div class="bar"><button class="btn back" id="menu">Главное меню</button></div>`;q.opts.forEach((o,i)=>{let b=document.createElement("button");b.type="button";b.className="option";let l=document.createElement("span");l.className="letter";l.textContent=letters[i];let t=document.createElement("span");t.textContent=o.label;b.append(l,t);b.onclick=()=>{answers[n]=i;feedback()};$("options").appendChild(b)});$("back").disabled=n===0;$("back").style.opacity=n===0?".45":"1";$("back").onclick=()=>{if(n>0){n--;renderQ()}};$("menu").onclick=menu;$("next").onclick=()=>{if(answers[n]===null)return;if(n<19){n++;renderQ()}else results()}}
function feedback(){let q=round[n];[...$("options").children].forEach((b,i)=>{b.classList.toggle("selected",answers[n]===i);b.style.borderColor="";b.style.background="";if(q.opts[i].correct){b.style.borderColor="#16804a";b.style.background="#eaf8f0"}else if(answers[n]===i){b.style.borderColor="#b42318";b.style.background="#fff0f0"}});let h=$("hint");h.className="hint";if(q.opts[answers[n]].correct){h.classList.add("correct");h.textContent="✅ Правильно! "+q.explain}else{h.classList.add("incorrect");h.textContent="❌ Ошибка. Правильный ответ: "+q.opts.find(o=>o.correct).label+". "+q.explain}$("next").disabled=false;$("next").textContent=n===19?"Завершить тест 🏁":"Далее ➡️"}
function results(){let score=answers.reduce((s,a,i)=>s+(round[i].opts[a].correct?1:0),0);$("app").innerHTML=`<h1>Тест завершён!</h1><p class="score">${score} / 20</p><p>${score===20?"Отлично! Все ответы правильные!":score>=16?"Очень хороший результат!":score>=10?"Хорошее начало. Повтори ошибки.":"Не расстраивайся — продолжай тренироваться!"}</p><div class="bar"><button class="btn next" id="new">Новый тест 🔄</button><button class="btn back" id="home">Главное меню</button></div><h2>Разбор ответов</h2><div id="review"></div>`;$("new").onclick=startTest;$("home").onclick=menu;round.forEach((q,i)=>{let d=document.createElement("div");d.className="review-item";let t=document.createElement("strong");t.textContent=`${i+1}. ${q.q}`;d.appendChild(t);let picked=q.opts[answers[i]],a=document.createElement("div");a.className=picked.correct?"good":"bad";a.textContent=`Твой ответ: ${letters[answers[i]]}) ${picked.label}`;d.appendChild(a);if(!picked.correct){let c=document.createElement("div");c.className="good";c.textContent="Правильно: "+q.opts.find(o=>o.correct).label;d.appendChild(c)}let e=document.createElement("div");e.textContent=q.explain;d.appendChild(e);$("review").appendChild(d)})}
menu();
</script></body></html>
